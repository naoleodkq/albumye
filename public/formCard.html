<!DOCTYPE html> <!-- diz ao navegador que é uma página html5 -->
<html lang="pt-br"> <!-- raiz da página -->
<head> <!-- configurações da página -->
	<meta charset="UTF-8"> <!-- conjunto de caracteres -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- ajusta a largura no celular -->
	<title>form</title> <!-- título da aba -->
	<link rel="shortcut icon" type="image/png" href="media/dondaCover.png"> <!-- ícone da aba -->
	<link rel="stylesheet" href="css/style.css"> <!-- liga o css -->
</head>
<body> <!-- corpo da página -->
	<header class="header"> <!-- topo -->
		<nav> <!-- menu -->
			<button id="btnThemeId" class="btnTheme" aria-label="Alterar Tema"> <!-- botão do tema -->
				<svg class="iconeTema" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"> <!-- ícone da lua -->
					<path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z"/> <!-- desenho do ícone -->
				</svg>
			</button>
			<ul class="navLinks"> <!-- lista de links -->
				<li><a href="index.html" class="inativo">index</a></li> <!-- item e link para o index -->
				<li><a href="home.html" class="inativo">home</a></li> <!-- item e link para a home -->
				<li><a href="formCard.html">criar</a></li> <!-- item e link da página atual -->
			</ul>
		</nav>
	</header>

	<div class="containerForm"> <!-- caixa do formulário -->
		<h2 class="tituloForm">Criador de Card</h2> <!-- título do formulário -->
		<form class="formCard" id="formCard"> <!-- formulário -->
			<div class="formDupla"> <!-- campo: nome do álbum -->
				<label for="nomeAlbum">Nome do Album:</label> <!-- texto do campo -->
				<input type="text" id="nomeAlbum" placeholder="Ex. Donda"> <!-- entrada de texto -->
			</div>
			<div class="formDupla"> <!-- campo: link do álbum -->
				<label for="linkAlbum">Link do Album:</label> <!-- texto do campo -->
				<input type="url" id="linkAlbum" placeholder="Ex. Link"> <!-- entrada de link -->
			</div>
			<div class="formDupla"> <!-- campo: artista -->
				<label for="nomeArtista">Artista:</label> <!-- texto do campo -->
				<input type="text" id="nomeArtista" placeholder="Ex. Ye"> <!-- entrada de texto -->
			</div>
			<div class="formDupla"> <!-- campo: link do artista -->
				<label for="linkArtista">Link do Artista:</label> <!-- texto do campo -->
				<input type="url" id="linkArtista" placeholder="Ex. Link"> <!-- entrada de link -->
			</div>
			<div class="formDupla"> <!-- campo: gênero -->
				<label for="generoAlbum">Gênero:</label> <!-- texto do campo -->
				<input type="text" id="generoAlbum" placeholder="Ex. Hip Hop"> <!-- entrada de texto -->
			</div>
			<div class="formDupla"> <!-- campo: descrição do álbum -->
				<label for="descricaoAlbum">Descrição do Album:</label> <!-- texto do campo -->
				<input type="text" id="descricaoAlbum" placeholder="Ex. Descrição"> <!-- entrada de texto -->
			</div>
			<div class="formDupla"> <!-- campo: imagem do álbum -->
				<label for="imagemAlbum">Link da Imagem do Album:</label> <!-- texto do campo -->
				<input type="url" id="imagemAlbum" placeholder="https://upload.wikimedia.org/wikipedia/commons/a/a0/Almost_black_square_020305.png"> <!-- entrada de link -->
			</div>
			<div class="formDupla"> <!-- campo: descrição da imagem -->
				<label for="descricaoImagem">Descrição da Imagem do Album:</label> <!-- texto do campo -->
				<input type="text" id="descricaoImagem" placeholder="Imagem Divertida"> <!-- entrada de texto -->
			</div>
			<input class="btSubmit" type="submit" value="Criar"> <!-- botão que cria o card -->
		</form>
	</div>

	<div id="colecao"></div> <!-- onde os cards criados aparecem -->

	<script src="js/tema.js"></script> <!-- troca de tema -->
	<script src="js/descricao.js"></script> <!-- botão + e - -->
	<script src="js/obraDeArte.js"></script> <!-- modelo do álbum -->
	<script src="js/galeria.js"></script> <!-- cria e guarda os cards -->
</body>
</html>
